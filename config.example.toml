# Jarvis example configuration (v1.0 base + v1.1 controlled input).
#
# Copy this file to config.toml and edit as needed. config.toml is
# gitignored so personal tweaks (hotkeys, voice, sound cue paths) never
# get committed. If config.toml is absent, config.py falls back to
# built-in defaults that mirror the values shown here.
#
# A present section may omit keys; omitted keys fall back to their
# default. An unknown section or unknown key is a config error (typos
# are caught, not silently ignored).

[backend]
model = "gemma4:12b-it-qat"
endpoint = "http://localhost:11434"
num_ctx = 65536
# If VRAM pressure appears, PROJECT.md's fallback is
# OLLAMA_KV_CACHE_TYPE=q8_0, then num_ctx = 32768 (applied by the human,
# not automatically by this config). If you lower num_ctx below 65536,
# lower [history].prompt_capacity_tokens and/or
# [history].reasoning_generation_reserve_tokens at the same time so their
# sum still fits num_ctx.
# Optional spike knobs:
# flash_attention = true
# kv_cache_type = "q8_0"  # Ollama docs also list "f16" (default) and
# "q4_0"; leave both fields unset to preserve current behavior.
# Optional generation options. Leave unset to preserve current behavior;
# no project defaults are chosen here without local measurements.
# temperature = 0.2
# top_p = 0.9
# top_k = 40
# min_p = 0.05
# repeat_penalty = 1.1
# repeat_last_n = 64
# seed = 123
# num_predict = 128
# stop = ["</speak>"]
# draft_num_predict = 16
# httpx's own default timeout (~5 s) is too short for a genuinely cold
# Ollama start (verified live - longer than the day-0 "4.2 s cold" figure,
# which was itself measured on an already-touched model). Only the read
# timeout is this generous; connect/write/pool stay short (localhost).
read_timeout_seconds = 120.0

[history]
# Prompt input capacity for the bounded working context. This excludes the
# reasoning/generation reserve below; by default the two sum exactly to
# backend.num_ctx, so lowering backend.num_ctx requires lowering one or both.
prompt_capacity_tokens = 49152
# Optional maxima for later context assembly policies. Fixed prompt input can
# reduce the realized recent-history or automatic-retrieval allocation.
recent_history_max_tokens = 24576
automatic_retrieval_max_tokens = 8192
# Mandatory reserves inside the prompt budget and outside it. These are not
# borrowed by recent history or retrieval.
tool_result_reserve_tokens = 8192
reasoning_generation_reserve_tokens = 16384
# One global estimator margin applied after estimating the complete prompt.
estimator_safety_margin_tokens = 1024
minimum_recent_exchanges = 1

[history.semantic]
# The rebuildable local semantic projection is enabled by default. If the
# configured model is unavailable, exact/prefix retrieval remains usable.
enabled = true
# Ollama tag as installed (namespace + tag), so /api/embeddings resolves it.
model = "blaifa/multilingual-e5-large-instruct:latest"
query_prefix = "query: "
passage_prefix = "passage: "
# Provisional hot-path deadline for semantic query embeddings.
timeout_seconds = 1.0
separation = 0.05
top_ratio = 0.98
dimension = 1024

[history.transcription]
# Explicit historical voice transcription (task-v1.8.0-20). It never runs on
# its own initiative: transcripts are generated only through the authenticated
# Journal transcript "Transcribe" control / generate endpoint. When enabled,
# the generate endpoint is available; disabling it removes that endpoint while
# read/edit of existing transcript overlays stay available.
enabled = true
# Model-facing English framing for the transcription request. Empty defers to
# the service's verified default (the wording PROJECT.md's day-0 fidelity
# check confirmed produces faithful verbatim Russian transcription).
instruction = ""
# How many transcription model calls may run at once. Kept low so historical
# transcription competes predictably with a live dialog turn for VRAM.
max_concurrency = 1

[history.annotation]
# Explicit historical annotation generation (task-v1.8.0-22). It never runs on
# its own initiative: annotations are generated only through an explicit
# user/UI command over a bounded event range, summarizing only that cited
# source material. Disabling it removes the generator.
enabled = true
# Model-facing framing for the annotation request. Empty defers to the
# service's default: a Russian instruction (so a Russian conversation is
# summarized in Russian) that summarizes only the cited excerpt and requires
# attribution (assistant claims must not be presented as the user's facts).
instruction = ""
# Model reasoning level for generation: "off", "low", "medium", or "high".
# "off" plus "low" cover the practical off/on choice; reasoning trace never
# reaches the stored annotation regardless. Other generation options come from
# [backend].
reasoning = "off"
# How many generation model calls may run at once. Kept low so historical
# generation competes predictably with a live dialog turn for VRAM.
max_concurrency = 1
# Largest event range one annotation may summarize (at most 200, the history
# read API's per-range limit).
max_source_events = 100
# Largest total source text sent to the model for one annotation, in
# characters. Event text has no upper limit of its own, so this bounds the
# prompt size (a few long events cannot form an unbounded request). The default
# 24000 (~12000 tokens by the conservative estimator) stays well under the
# input budget; oversize source is rejected before any model call.
max_source_chars = 24000
# Largest generated annotation, in characters (at most 20000, the annotation
# overlay store's own limit).
max_annotation_chars = 4000

[hotkeys]
screenshot_full = "ctrl+alt+s"
screenshot_region = "ctrl+alt+r"
shutdown = "ctrl+alt+q"
# v1.1: toggles microphone capture on/off (privacy pause) - a single
# toggle, not separate sleep/wake bindings. See PROJECT.md's Architecture
# v1.1 section.
mic_sleep_toggle = "ctrl+alt+m"
# v1.1: reads the current clipboard and submits it as a prompt, in place
# of a spoken question.
clipboard_submit = "ctrl+alt+v"
# Thinking mode: toggles a persistent runtime state applied to future
# turns (not the current in-flight one). Off by default - see PROJECT.md's
# thinking-mode architecture section.
thinking_toggle = "ctrl+alt+t"
# v1.7.0: cancels the in-flight turn (TTS playback and the backend
# stream) and returns Jarvis to listening. Works on any hardware - no
# acoustic detection required. See PROJECT.md's v1.7.0 architecture
# section.
interrupt = "ctrl+alt+i"

[vad]
threshold = 0.5
max_chunk_seconds = 30
# Silero itself splits raw speech into small segments at any internal
# pause (~100 ms, not configurable here). Adjacent segments closer
# together than request_end_pause_seconds are merged into one utterance
# (a breath or thinking pause mid-request, not the end of it). Only a
# gap at least this long - absence of detected speech, not necessarily
# full digital silence - is treated as the user actually finishing.
# Paid *before* PROJECT.md's ~3 s response-start window starts (that
# window is measured from publish, not from the literal instant speech
# stopped), so it adds to total perceived latency without counting
# against the ~3 s figure itself. 2.0 s is a deliberately conservative
# value for the development stage; production is expected to tighten it
# to ~1.0-1.5 s once request-boundary behavior is validated. See
# PROJECT.md's Architecture v1.0 and task-07's backlog notes.
request_end_pause_seconds = 2.0
# How long the busy flag stays up after Jarvis finishes speaking, before
# capture resumes and the "listening" cue plays. A short grace period,
# not an echo guard: since the stale-buffer-replay fix, auto-pause stops
# the stream and invalidates the buffer, so nothing heard during a turn
# can leak into the next one regardless of this value.
resume_cooldown_seconds = 1.0

# TTS parameters are route-specific. Config parsing validates their shape;
# model files and model/parameter compatibility are checked on first use.
[tts]
# Master on/off default. The dashboard also has a live mute toggle, but that
# runtime toggle does not persist here - this is only the value the next
# restart seeds the toggle from.
enabled = true

[tts.languages.ru]
engine = "silero"
model = "v3_1_ru"
language = "ru"
speaker = "baya"
sample_rate = 48000
# Optional model.apply_tts parameters. Omit them to use the selected model's
# own defaults; unsupported model/parameter combinations fail on first use.
# put_accent = true
# put_yo = true

# Optional v1.2.9 bilingual route. Jarvis does not download Piper models at
# runtime; configure this only after placing the local .onnx model yourself.
# Any non-default routing must cover BOTH ru and en - charset segmentation
# emits English units for Latin text regardless of configuration.
# [tts.languages.en]
# engine = "piper"
# model = ".local-models/piper/en_US-lessac-medium/en_US-lessac-medium.onnx"
# config_path = ".local-models/piper/en_US-lessac-medium/en_US-lessac-medium.onnx.json"
# use_cuda = false
# speaker_id = 0
# length_scale = 1.0
# noise_scale = 0.667
# noise_w_scale = 0.8
# normalize_audio = true
# volume = 1.0

[capture]
default_mode = "full"

# On-command still frames from local USB cameras and LAN cameras reached
# over RTSP. Off by default, and the capture tool must also be enabled in
# the Status Console before the model can use it. Jarvis reads frames
# only: it never aims a motorized lens or switches an illuminator - see
# tasks/backlog/camera-world-changing-controls.md for why that is a
# separate decision rather than a missing feature.
[camera]
enabled = false
# usb_device_index describes the implicit "usb" source used when no
# [[camera.sources]] entry is configured below. frame_width/frame_height/
# fourcc are capture tuning for every USB source, not per-source identity;
# a LAN stream's resolution is whatever the camera publishes.
usb_device_index = 0
frame_width = 1920
frame_height = 1080
fourcc = "MJPG"
capture_timeout_seconds = 5.0

# Named sources. Leave the list out entirely for a USB-only setup. Name a
# source for what it shows, never for its wiring, and describe it honestly:
# the description is what the model is told about the view.
#
# A LAN camera is an explicit opt-in capability and its captures are
# reported as LAN on the data-source axis, not local.
#
# CREDENTIALS ARE STORED HERE IN CLEAR TEXT. Anyone who can read this
# file can watch that camera's live stream, and can reuse the password
# anywhere else you used it. Treat the file accordingly: keep it out of
# version control and backups, and give the camera an account that exists
# only for Jarvis. Improving this is a known open question, not a settled
# design - see tasks/backlog/secret-storage.md.
#
# Write host, port, user, password, and stream_path as separate values and
# never percent-encode anything by hand: the password is taken literally,
# however many of `# / @ : ? &` it contains, and Jarvis assembles the URL.
# A ready-made URL from the camera's documentation cannot be pasted as one
# line; that is deliberate, because a password containing any of those
# characters silently corrupts such a URL.
#
# Finding stream_path is trial and error. A camera typically answers 401
# to every path until the credentials are right, so a wrong path and a
# wrong password look identical. Use
# `python -m manual.manual_check_rtsp_discovery --host <ip> --user <user>`
# to try candidate paths in milliseconds instead of waiting out a capture
# timeout per attempt. Vendor prerequisites first: create an RTSP/media
# account in the camera's own app and turn media-stream encryption off,
# or every path stays 401 no matter what you type here.
#
# [[camera.sources]]
# name = "desk"
# kind = "usb"
# device_index = 0
# description = "Webcam on the desk, facing the user."
#
# [[camera.sources]]
# name = "wide"
# kind = "lan"
# host = "192.168.1.108"
# port = 554
# user = "admin"
# password = "your-password"
# stream_path = "/cam/realmonitor?channel=2&subtype=0"
# description = "Fixed wide-angle lens covering the whole room."
#
# [[camera.sources]]
# name = "detail"
# kind = "lan"
# host = "192.168.1.108"
# port = 554
# user = "admin"
# password = "your-password"
# stream_path = "/cam/realmonitor?channel=1&subtype=0"
# description = "Motorized lens; it shows wherever it was last aimed."
#
# The description is what the model is told about the view, so it has to
# be true. A motorized lens is not a reproducible source: it shows
# wherever it was last aimed, including by the camera's own auto-tracking,
# so say that rather than describing a fixed view it does not have.

[microphone]
# "" means sounddevice's default input device. Also settable from the
# live Status Console's configuration menu (Model/Microphone selectors) -
# that writes config.ui.toml instead of this file, which takes precedence
# over whatever is set here per-key (see PROJECT.md's Architecture v1.2.4
# section). Restart-to-apply either way: takes effect on the next
# `python main.py` start, not live.
device = ""
# Windows lists one physical microphone once per host API ("MME",
# "Windows DirectSound", "Windows WASAPI", "Windows WDM-KS"), all under
# the same device name, so a name alone can match several devices. ""
# resolves by name and refuses to guess when that is ambiguous; naming
# the host API picks one copy. Selecting a microphone in the Status
# Console writes both fields for you. Host API is not cosmetic here -
# see PROJECT.md's microphone entries for MME's role in wake recovery
# and post-mute capture quality.
host_api = ""

[clipboard]
# 20000 chars (~5000 tokens at a rough 4 chars/token estimate): a
# conservative cap against an accidental huge paste (e.g. a log file)
# blowing up local-context latency. Text over this is truncated with a
# visible in-band marker, never silently cut.
max_chars = 20000

[attachments]
# Uploaded audio attachments (Journal input dock), not microphone speech.
# Files are decoded and split into sequential 30 s clips before reaching
# the model - 30 s is a verified Ollama per-clip ceiling (PROJECT.md) and
# is NOT configurable. A file that would chunk into more than
# max_audio_clips clips is rejected outright with a message asking the
# user to trim/split, never silently sent as a truncated prefix.
#
# WARNING: DO NOT SET THIS ABOVE 10 (= 300 s / 5 min) UNLESS YOU KNOW WHAT
# YOU ARE DOING. Every extra clip is another ~30 s of decoded audio
# base64-encoded into the SAME prompt as every other attachment and the
# conversation history - raising this multiplies upload processing time,
# prompt size, and per-turn model latency, and has not been verified past
# the default. 3 clips (90 s) is the attachment policy's own default
# (tasks/attachment-policy-v1.6.0.md).
max_audio_clips = 3

[journal]
# Append-only local dialog journal. One app run creates one lazy session on
# the first accepted turn; voice audio is stored as .wav files next to the
# JSONL event log.
enabled = true
root = "journal"

[logging]
# Durable local system log: detailed, English, for diagnosing a problem
# after the fact. This is the file to attach to a problem report. It is
# never sent anywhere by Jarvis - copying it out is always a manual act.
# The setting is the directory; rotation owns the file names.
directory = "logs"
max_bytes = 2000000
backup_count = 5

[memory]
# Local curated memory directory. By default this sits beside the default
# journal/ directory. Files are UTF-8 Markdown edited by the user; Jarvis only
# reads them in v1.5.3.
root = "memory"
self_file = "self.md"
memory_file = "memory.md"
# Per-file injection caps. Over-cap files are truncated only for prompt
# injection, with a warning; the files on disk are never rewritten by loading.
self_max_chars = 8000
memory_max_chars = 8000
# Session fork seed budget, in characters. A fork keeps a verbatim text-only
# tail of the source session, dropping oldest turns first and never splitting
# a turn. 12000 chars is roughly 3000 tokens at the project planning estimate.
fork_seed_max_chars = 12000

[sound_cues]
listening = "sounds/listening.wav"
thinking = "sounds/thinking.wav"
speaking = "sounds/speaking.wav"
error = "sounds/error.wav"
# v1.1: clipboard submission accepted / rejected (truncated or empty -
# distinct from the generic error above, which covers backend/TTS
# failures), and microphone sleep/wake.
clipboard = "sounds/clipboard.wav"
input_error = "sounds/input_error.wav"
mic_sleep = "sounds/mic_sleep.wav"
mic_wake = "sounds/mic_wake.wav"
# Thinking-mode toggle on/off - distinct from the generic "thinking" cue
# above, which plays per-turn while a request is in flight regardless of
# this mode.
thinking_on = "sounds/thinking_on.wav"
thinking_off = "sounds/thinking_off.wav"

[ui]
# Status Console / Touchstrip interface language: "en" (default) or "ru".
# UI chrome only - the assistant's dialog language, the system prompt,
# and TTS output are not affected by this setting.
language = "en"

[files]
# Loose per-session files the model can create and read (story-v1.8.1).
# They live in the session directory alongside the event log but are never
# journal events, so their content stays out of the transcript, corpus, and
# semantic index. The model only ever sees the generated storage name.
#
# write_ext_blacklist: extensions the model may NOT create. Deny-list, not
# allow-list (fails open by design): files land in Jarvis's own session
# directory and are never executed by Jarvis, so anything unlisted is
# allowed and you own the list. Case-insensitive; applies to writes only.
# The default blocks Windows executable/script extensions.
write_ext_blacklist = [
    "exe", "bat", "cmd", "com", "scr", "msi", "dll", "ps1", "psm1", "vbs",
    "vbe", "js", "jse", "wsf", "wsh", "lnk", "reg", "sys", "cpl", "jar",
]
# Bounds on model-facing payloads. Asymmetric on purpose: a write is capped
# in characters (the model produces a string), a read in bytes (an on-disk
# file of unknown encoding). max_image_view_bytes matches the attachment
# image cap.
max_text_write_chars = 20000
max_text_read_bytes = 65536
max_image_view_bytes = 15728640

[prompts]
# Dialog prompts sent to the model. `system` opens every turn's message
# list; `warmup` is the throwaway request sent once at startup before
# input is accepted. Both must be non-empty. These are dialog data, not
# UI text: they are independent of [ui].language. To switch the
# assistant's dialog language, replace them, e.g.:
# system = """You are Jarvis, the user's local voice assistant. Answer in
# English unless asked otherwise. Keep answers short: one or two
# sentences unless details are requested - longer answers take longer to
# speak. Do not use Markdown unless explicitly asked. If a screenshot of
# the user's screen arrives with a voice message, take it into account."""
# warmup = "Hello"
system = """Ты - Джарвис, локальный голосовой ассистент пользователя. Отвечай по-русски, если пользователь явно не попросил другой язык. Отвечай коротко и по существу: одно-два предложения, если не попросили подробностей - чем длиннее ответ, тем дольше пользователь ждёт, пока он прозвучит. Не используй Markdown, если пользователь явно не просит форматирование. Английские термины, API names, identifiers, короткие английские фразы и цитаты можно писать обычным текстом там, где они уместны; языковую разметку добавлять не нужно. Если вместе с голосовым сообщением пришёл скриншот экрана пользователя, отвечай с учётом того, что на нём видно."""
warmup = "Привет"
# Optional reasoning-mode prompt sections. Off has no separate section. At
# low, medium, or high, the selected section follows the base system prompt
# and any self.md/memory.md material for that turn.
#
# Each value is either a non-empty literal or a prompt-only @file reference.
# References always resolve under ./.jarvis/, even when they start with /:
# @/reasoning/medium.md means ./.jarvis/reasoning/medium.md. Parent traversal
# (..) is rejected. A literal that begins with @ is not supported because @
# always denotes a file reference; a missing, unreadable, or blank file stops
# startup with a config error.
# reasoning_low = "Think briefly, then answer directly."
# reasoning_medium = "@/reasoning/medium.md"
# reasoning_high = "@reasoning/high.md"
#
# Response-mode output contracts for modes 2 and 3 below (story-v1.9.0).
# Each has a working built-in default already, so voice mode needs no
# config change; override here to customize what "voice-friendly" means.
# response_voice = "Speak in plain connected prose, no lists or tables."
# response_text_voice = "Restate the shown text aloud; you may refer to it."

[response]
# Response mode: "text" (default, today's behavior), "voice" (TTS-Only,
# self-contained one-pass spoken answer, no on-screen reference), or
# "text_voice" (Text+TTS, two passes - see task-v1.9.0-3 once it lands).
# See tasks/story-v1.9.0-response-modes.md for the full trade-offs.
mode = "text"

[mcp]
# Off by default (two-tier locality contract, PROJECT.md): with enabled =
# false, no MCP server process is spawned and no connection is opened -
# equivalent to the external MCP capability not existing. Builtin local
# tools may still appear in the shared tool list; they are in-process,
# data_boundary = "local", and independent of this switch. Enable MCP
# only if you understand a connected server can reach the network; every
# call is logged to the system events panel.
enabled = false
# Native Ollama tools are the measured default. "prompt" keeps the
# fallback JSON contract selectable for templates without native support.
presentation_strategy = "native"
# Total dispatches allowed during one user turn. Calls returned together
# are executed sequentially and consume this shared budget.
max_tool_calls_per_turn = 3
# Each configured server is its own stdio subprocess, with its own
# enable flag independent of the module-wide switch above:
# The provider name "builtin" is reserved for Jarvis's in-process tools
# and cannot be used for an MCP server.
# [mcp.servers.search]
# command = "npx"
# args = ["-y", "some-mcp-search-server"]
# env = { PROVIDER_SETTING = "value" }
# enabled = true
# data_boundary = "internet" # local | lan | internet | unknown
# A non-empty tool_adapters table is an allowlist. It can rename an
# upstream tool, hide provider-specific arguments from the model, and
# inject fixed arguments into the audited outbound call:
# [mcp.servers.search.tool_adapters.upstream_search]
# name = "web_search"
# allowed_arguments = ["query"]
# fixed_arguments = { backend = "provider-backend" }
# Optional overrides for a server whose tools have different reach:
# [mcp.servers.search.tool_boundaries]
# cached_lookup = "local"
